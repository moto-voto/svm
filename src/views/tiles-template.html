<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Seasonvar Mobile - Virtualized Grid</title>
    <!-- Tailwind CSS for utility styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: '#ff9800',
                    }
                }
            }
        }
    </script>
    <style>
        /* Base resets and touch performance */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #0d0d0d;
            color: #e5e5e5;
            overflow-y: scroll;
        }

        /* Poster card aspect ratio (~ 2 : 3.1) */
        .poster-card {
            position: absolute;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            background-color: #1a1a1a;
            user-select: none;
            display: block;
            text-decoration: none;
            will-change: transform;
        }

        /* Active touch response */
        .poster-card:active {
            transform: scale(0.96);
        }

        /* Hover elevation on desktop */
        @media (hover: hover) {
            .poster-card:hover {
                transform: translateY(-4px);
                box-shadow: 0 12px 24px rgba(0, 0, 0, 0.6);
            }
        }

        /* Poster Image Background */
        .poster-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center top;
            transition: transform 0.3s ease;
        }

        @media (hover: hover) {
            .poster-card:hover .poster-bg {
                transform: scale(1.05);
            }
        }

        /* Bottom gradient text overlay */
        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 0%,
                rgba(0, 0, 0, 0.2) 40%,
                rgba(0, 0, 0, 0.85) 75%,
                rgba(0, 0, 0, 0.98) 100%
            );
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 10px 8px;
            text-align: center;
            color: #ffffff;
        }

        /* Subtle text shadow for high contrast legibility */
        .text-shadow-sm {
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        /* Smooth scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 152, 0, 0.7);
        }

        /* Loader Animation */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spinner {
            border: 4px solid rgba(255, 152, 0, 0.2);
            border-left-color: #ff9800;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Header Bar matching Seasonvar Mobile design -->
    <header class="sticky top-0 z-30 bg-[#121212] border-b border-neutral-800/80 px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col items-center gap-2">
            <!-- Title Bar Header -->
            <div class="flex items-center justify-center w-full relative">
                <h1 class="text-base sm:text-lg font-bold text-[#ff9800] tracking-wide">Seasonvar Mobile</h1>
                <span id="renderedStats" class="absolute right-0 text-xs bg-[#ff9800]/15 text-[#ff9800] font-semibold px-2.5 py-0.5 rounded-full">
                    0 / 0
                </span>
            </div>

            <!-- Search Form Bar -->
            <form id="searchForm" class="w-full flex items-center shadow-inner rounded overflow-hidden bg-[#2d2d2d] border border-neutral-700/60 focus-within:border-[#ff9800] transition-colors" onsubmit="return false;">
                <input type="text" id="searchInput" placeholder="Поиск сериала..." 
                       class="w-full px-3 py-1.5 text-sm bg-transparent text-neutral-100 placeholder-neutral-400 focus:outline-none">
                <button type="submit" id="searchBtn" class="bg-[#ff9800] hover:bg-[#e68900] active:bg-[#cc7a00] text-black font-bold text-sm px-4 py-1.5 transition-colors shrink-0 flex items-center justify-center">
                    Go
                </button>
            </form>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="max-w-7xl mx-auto p-3 sm:p-5 flex-1 w-full relative">
        
        <!-- Loading Spinner Overlay -->
        <div id="loadingOverlay" class="hidden absolute inset-0 z-20 bg-black/60 backdrop-blur-xs flex flex-col items-center justify-start pt-24 transition-opacity duration-200">
            <div class="spinner mb-3"></div>
            <p class="text-sm font-medium text-[#ff9800]">Загрузка результатов...</p>
        </div>

        <!-- Empty search result alert -->
        <div id="noResults" class="hidden py-20 text-center text-neutral-400 font-medium">
            Ничего не найдено
        </div>

        <!-- Virtual Canvas Container (Grows to full dataset height) -->
        <div id="virtualCanvas" class="relative w-full">
            <!-- Active visible nodes rendered dynamically -->
        </div>
    </main>

    <script>
        /**
         * @typedef SerialDescription
         * @property {string} title
         * @property {string} fullLink
         * @property {string} image
         */

        // Covers dataset for generation
        const sampleCovers = [
            "https://images.unsplash.com/photo-1542204165-65bf26472b9b?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=600&q=80"
        ];

        const titlePrefixes = ["Голубые", "ПинКод", "Все существа", "Эр Джей", "Темные", "Забытый", "Звездный", "Городские"];
        const titleSuffixes = ["огни", "2.0", "большие и малые", "Декер", "тени", "сезоны", "хроники", "истории"];

        /**
         * Generate synthetic mock serials database
         */
        function generateMockDatabase(query = '', count = 10000) {
            const list = [];
            for (let i = 1; i <= count; i++) {
                const prefix = titlePrefixes[i % titlePrefixes.length];
                const suffix = titleSuffixes[(i * 3) % titleSuffixes.length];
                const title = `${prefix} ${suffix} #${i}`;
                
                // If a search query is present, filter items during generation
                if (query && !title.toLowerCase().includes(query.toLowerCase())) {
                    continue;
                }

                list.push({
                    title: title,
                    fullLink: `https://example.com/show/${i}`,
                    image: sampleCovers[i % sampleCovers.length]
                });
            }
            return list;
        }

        // Global dataset holder
        let allItems = generateMockDatabase('', 10000);

        /**
         * Simulated Backend API request
         * @param {string} query
         * @returns {Promise<Array<SerialDescription>>}
         */
        async function fetchFromBackend(query) {
            // Simulate network latency (400ms - 800ms)
            const latency = Math.floor(Math.random() * 400) + 400;
            await new Promise(resolve => setTimeout(resolve, latency));

            // Return newly fetched array from BE
            return generateMockDatabase(query, 10000);
        }

        /**
         * Virtualized Grid Engine
         */
        class GridVirtualizer {
            constructor(containerId, statsId, noResultsId) {
                this.container = document.getElementById(containerId);
                this.statsElem = document.getElementById(statsId);
                this.noResultsElem = document.getElementById(noResultsId);

                this.minCardWidth = 145; // Minimum card width in pixels
                this.gap = 14;           // Gap spacing between cards
                this.aspectRatio = 2 / 3.1;
                this.bufferRows = 2;     // Rows rendered above and below viewport

                this.columns = 1;
                this.cardWidth = 0;
                this.cardHeight = 0;
                this.rowHeight = 0;
                this.totalRows = 0;

                this.mountedNodes = new Map(); // Map of index -> DOM element

                this.onScroll = this.onScroll.bind(this);
                this.onResize = this.onResize.bind(this);

                window.addEventListener('scroll', this.onScroll, { passive: true });
                window.addEventListener('resize', this.onResize);
                window.addEventListener('orientationchange', this.onResize);
            }

            /**
             * Calculate columns based on dynamic screen width
             */
            updateDimensions() {
                const containerWidth = this.container.clientWidth || (window.innerWidth - 24);
                
                if (window.innerWidth >= 640) {
                    this.minCardWidth = 165;
                    this.gap = 18;
                } else if (window.innerWidth >= 400) {
                    this.minCardWidth = 145;
                    this.gap = 14;
                } else {
                    this.minCardWidth = 125;
                    this.gap = 10;
                }

                this.columns = Math.max(1, Math.floor((containerWidth + this.gap) / (this.minCardWidth + this.gap)));
                const totalGaps = (this.columns - 1) * this.gap;
                this.cardWidth = (containerWidth - totalGaps) / this.columns;
                this.cardHeight = this.cardWidth / this.aspectRatio;
                this.rowHeight = this.cardHeight + this.gap;

                this.totalRows = Math.ceil(allItems.length / this.columns);
                const totalHeight = this.totalRows > 0 ? (this.totalRows * this.rowHeight - this.gap) : 0;
                this.container.style.height = `${totalHeight}px`;
            }

            /**
             * Virtualized rendering loop
             */
            render() {
                if (allItems.length === 0) {
                    this.noResultsElem.classList.remove('hidden');
                    this.clearAllNodes();
                    this.statsElem.textContent = `0 / 0`;
                    return;
                }
                this.noResultsElem.classList.add('hidden');

                const containerTop = this.container.getBoundingClientRect().top + window.scrollY;
                const scrollTop = Math.max(0, window.scrollY - containerTop);
                const viewportHeight = window.innerHeight;

                let startRow = Math.floor(scrollTop / this.rowHeight) - this.bufferRows;
                let endRow = Math.ceil((scrollTop + viewportHeight) / this.rowHeight) + this.bufferRows;

                startRow = Math.max(0, startRow);
                endRow = Math.min(this.totalRows - 1, endRow);

                const startIndex = startRow * this.columns;
                const endIndex = Math.min(allItems.length - 1, ((endRow + 1) * this.columns) - 1);

                const visibleIndices = new Set();
                for (let i = startIndex; i <= endIndex; i++) {
                    visibleIndices.add(i);
                }

                // Recycle DOM elements out of view
                for (const [index, node] of this.mountedNodes.entries()) {
                    if (!visibleIndices.has(index)) {
                        node.remove();
                        this.mountedNodes.delete(index);
                    }
                }

                // Mount visible DOM nodes
                for (let index = startIndex; index <= endIndex; index++) {
                    if (!this.mountedNodes.has(index)) {
                        const item = allItems[index];
                        const node = this.createCardElement(item, index);
                        this.container.appendChild(node);
                        this.mountedNodes.set(index, node);
                    } else {
                        this.positionCardNode(this.mountedNodes.get(index), index);
                    }
                }

                this.statsElem.textContent = `${this.mountedNodes.size} visible (${allItems.length.toLocaleString()} total)`;
            }

            positionCardNode(node, index) {
                const row = Math.floor(index / this.columns);
                const col = index % this.columns;

                const left = col * (this.cardWidth + this.gap);
                const top = row * this.rowHeight;

                node.style.width = `${this.cardWidth}px`;
                node.style.height = `${this.cardHeight}px`;
                node.style.transform = `translate3d(${left}px, ${top}px, 0)`;
            }

            createCardElement(item, index) {
                const card = document.createElement('a');
                card.href = item.fullLink;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                card.className = 'poster-card';
                
                this.positionCardNode(card, index);

                card.innerHTML = `
                    <div class="poster-bg" style="background-image: url('${item.image}')"></div>
                    <div class="card-overlay">
                        <h2 class="text-xs sm:text-sm font-bold text-white leading-snug text-shadow-sm line-clamp-2">
                            ${this.escapeHTML(item.title)}
                        </h2>
                    </div>
                `;
                return card;
            }

            escapeHTML(str) {
                return str.replace(/[&<>'"]/g, 
                    tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
                );
            }

            clearAllNodes() {
                for (const node of this.mountedNodes.values()) {
                    node.remove();
                }
                this.mountedNodes.clear();
            }

            onScroll() {
                requestAnimationFrame(() => this.render());
            }

            onResize() {
                this.updateDimensions();
                this.render();
            }

            resetData() {
                this.clearAllNodes();
                this.updateDimensions();
                window.scrollTo(0, 0);
                this.render();
            }
        }

        let virtualizer;

        /**
         * Perform Async Search request to Backend
         */
        async function performSearch() {
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');
            
            const query = searchInput.value.trim();

            try {
                // Show loader and disable search input
                loadingOverlay.classList.remove('hidden');
                searchInput.disabled = true;
                searchBtn.disabled = true;

                // Async fetch call returning new array for allItems
                allItems = await fetchFromBackend(query);

                // Update virtualized grid layout & DOM
                virtualizer.resetData();
            } catch (err) {
                console.error("Failed to fetch data from BE:", err);
            } finally {
                // Hide loader and enable search input
                loadingOverlay.classList.add('hidden');
                searchInput.disabled = false;
                searchBtn.disabled = false;
                searchInput.focus();
            }
        }

        // Initialize application on page load
        window.addEventListener('DOMContentLoaded', () => {
            virtualizer = new GridVirtualizer('virtualCanvas', 'renderedStats', 'noResults');
            virtualizer.updateDimensions();
            virtualizer.render();

            const searchForm = document.getElementById('searchForm');

            // Form submit trigger
            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                performSearch();
            });
        });
    </script>
</body>
</html>
